<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>tribu</title>
<meta name="description" content="tribu: organizá salidas con tu grupo y sumate a experiencias.">
<meta name="theme-color" content="#FAFAF7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F0F0F" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="tribu">
<meta name="application-name" content="tribu">
<meta name="format-detection" content="telephone=no">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --bg:#FAFAF7;--surface:#FFFFFF;--fg:#111111;--fg2:#4A4A4A;--fg3:#707070;--line:#EAEAE6;--line2:#D4D4CF;
  --ink:#111111;--on-ink:#FFFFFF;--accent:#2F7D4A;--accent-bg:#EAF3EC;--cardon:#2F7D4A;--ok:#2F5815;--ok-bg:#EEF7E8;
  --font:'Barlow',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F0F0F;--surface:#181818;--fg:#F2F2F2;--fg2:#C4C4C4;--fg3:#9C9C9C;--line:#262626;--line2:#3A3A3A;
  --ink:#F2F2F2;--on-ink:#111111;--accent:#7CC48F;--accent-bg:#13241A;--cardon:#5FAE77;--ok:#B7E39A;--ok-bg:#16220F;color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0F0F0F;--surface:#181818;--fg:#F2F2F2;--fg2:#C4C4C4;--fg3:#9C9C9C;--line:#262626;--line2:#3A3A3A;
  --ink:#F2F2F2;--on-ink:#111111;--accent:#7CC48F;--accent-bg:#13241A;--cardon:#5FAE77;--ok:#B7E39A;--ok-bg:#16220F;color-scheme:dark;}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
button,label,.input{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.app{height:100%;min-height:0;max-width:520px;margin:0 auto;display:flex;flex-direction:column;position:relative;background:var(--bg)}
@media (min-width:560px){body{background:var(--line)}.app{border-left:1px solid var(--line);border-right:1px solid var(--line)}}

.logo{display:inline-flex;align-items:baseline;font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1;color:var(--fg)}
.logo svg{width:1.08em;height:1.08em;margin-right:-.3em;color:var(--cardon);flex-shrink:0}
.logo.xl{font-size:64px}

header.top{flex-shrink:0;padding:12px 20px 4px;display:flex;flex-direction:column;gap:2px}
.brandbar{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px}
.tribe-pick{align-self:flex-start;display:flex;align-items:center;gap:6px;min-height:40px;font-size:20px;font-weight:700;letter-spacing:-.01em;max-width:100%;text-align:left}
.tribe-pick span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tribe-pick svg{flex-shrink:0;color:var(--fg3)}
.page-t{font-size:20px;font-weight:700;letter-spacing:-.01em;min-height:40px;display:flex;align-items:center}

.stage{flex:1;min-height:0;position:relative;display:flex;flex-direction:column}
main{flex:1;overflow-y:auto;padding:4px 20px 96px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
#mapHost{position:absolute;inset:0;z-index:1}
#map{position:absolute;inset:0;background:var(--line)}
.map-top{position:absolute;top:8px;left:0;right:0;z-index:600;pointer-events:none}
.map-top .chips-row{pointer-events:auto;padding:0 16px}
.float-pill{position:absolute;left:16px;bottom:18px;z-index:600;height:44px;padding:0 16px;border-radius:999px;background:var(--surface);border:1px solid var(--line2);font-weight:600;font-size:14px;display:flex;align-items:center;gap:6px;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.leaflet-container{font-family:var(--font)}
.pin{width:34px;height:34px;border-radius:999px;background:var(--ink);color:var(--on-ink);border:2px solid var(--surface);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.pin.on{background:var(--cardon);color:#fff}

.chips-row{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0 10px}
.chips-row::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;min-height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line2);background:var(--surface);font-size:14px;font-weight:600;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}

nav.tabs{flex-shrink:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--line);background:var(--bg);height:62px;position:relative;z-index:5}
nav.tabs button{color:var(--fg3);font-size:12px;font-weight:500;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
nav.tabs button[aria-current="page"]{color:var(--fg);font-weight:700}

.section-t{font-size:13px;font-weight:600;color:var(--fg3);margin:22px 0 4px}
.section-t:first-child{margin-top:6px}
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item-main{flex:1;min-width:0;text-align:left;display:flex;flex-direction:column;gap:2px;min-height:44px;justify-content:center}
.item-t{font-size:17px;font-weight:600;line-height:1.25}
.meta{font-size:14px;color:var(--fg3)}
.meta b{color:var(--fg2);font-weight:600}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:1px 8px;border-radius:999px;background:var(--accent-bg);color:var(--accent)}
.vote{width:52px;height:52px;border-radius:14px;border:1px solid var(--line2);display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;font-size:15px;font-weight:700;line-height:1}
.vote[aria-pressed="true"]{background:var(--accent-bg);border-color:transparent;color:var(--accent)}
.time{width:52px;flex-shrink:0;font-size:17px;font-weight:700;line-height:1.1}
.date{width:48px;flex-shrink:0;text-align:center;line-height:1}
.date b{display:block;font-size:22px;font-weight:700}
.date span{font-size:12px;color:var(--fg3);text-transform:uppercase;letter-spacing:.04em}
.mini{min-height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line2);font-size:14px;font-weight:600;white-space:nowrap;display:inline-flex;align-items:center;gap:4px;flex-shrink:0}
.mini.ink{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.mini.ok{background:var(--ok-bg);border-color:transparent;color:var(--ok)}
.dot{width:38px;height:38px;border-radius:999px;border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0;color:var(--fg2)}
.avs{display:inline-flex;vertical-align:middle;margin-right:8px}
.av{width:22px;height:22px;border-radius:999px;border:2px solid var(--bg);margin-right:-6px;background:var(--line);display:inline-flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:var(--fg2);flex-shrink:0}
.av.md{width:36px;height:36px;border:0;margin:0;font-size:12px}
.av.lg{width:64px;height:64px;border:0;margin:0;font-size:20px}
.bar{height:6px;border-radius:6px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--cardon)}

.btn{min-height:50px;width:100%;border-radius:12px;border:1px solid var(--line2);font-size:16px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--surface)}
.btn.ink{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.btn.ok{background:var(--ok-bg);border-color:transparent;color:var(--ok)}
.btn.quiet{border-color:transparent;background:transparent;color:var(--fg3);min-height:44px;font-size:15px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.fab{position:absolute;right:16px;bottom:78px;height:50px;padding:0 18px;border-radius:999px;background:var(--ink);color:var(--on-ink);font-weight:600;display:flex;align-items:center;gap:8px;box-shadow:0 4px 16px rgba(0,0,0,.2);z-index:700}

.empty{padding:44px 8px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px}
.empty p{margin:0;color:var(--fg2);max-width:30ch}
.empty .btn{max-width:260px}
.banner{margin:0 20px 8px;padding:10px 12px;border-radius:10px;font-size:13px;background:var(--accent-bg);color:var(--fg2)}
.stats{display:flex;gap:28px;margin:18px 0 4px}
.stats b{display:block;font-size:24px;font-weight:700;line-height:1.1}
.stats span{font-size:13px;color:var(--fg3)}
.seg{display:flex;gap:20px;border-bottom:1px solid var(--line);margin-top:24px}
.seg button{min-height:44px;font-size:15px;font-weight:500;color:var(--fg3);border-bottom:2px solid transparent;margin-bottom:-1px}
.seg button[aria-selected="true"]{color:var(--fg);font-weight:700;border-color:var(--fg)}
.callout{display:flex;align-items:center;gap:12px;padding:14px;border-radius:14px;background:var(--accent-bg)}
.num{font-size:15px;font-weight:700;flex-shrink:0}
.pos{width:20px;font-weight:700;color:var(--fg3);flex-shrink:0}

.bell{position:relative;width:44px;height:44px;border-radius:999px;display:flex;align-items:center;justify-content:center;color:var(--fg)}
.badge{position:absolute;top:5px;right:4px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--cardon);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid var(--bg)}
.notif{display:flex;gap:12px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--line);text-align:left;width:100%}
.notif .ndot{width:8px;height:8px;border-radius:8px;background:var(--cardon);margin-top:8px;flex-shrink:0}
.notif .ndot.read{background:transparent}
.desc{font-size:14px;color:var(--fg2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.why{font-size:12px;font-weight:600;color:var(--accent)}
.bnr{width:100%;aspect-ratio:16/9;border-radius:16px;object-fit:cover;display:block;background:var(--line)}
.thumb{width:64px;height:64px;border-radius:12px;object-fit:cover;flex-shrink:0;background:var(--line)}
.hcards{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;margin:0 -20px;padding:2px 20px 8px;scroll-snap-type:x mandatory}
.hcards::-webkit-scrollbar{display:none}
.hcard{flex:0 0 78%;max-width:320px;scroll-snap-align:start;text-align:left;display:flex;flex-direction:column;gap:4px}
.hcard .bnr{border-radius:14px;margin-bottom:4px}
.photo-pick{position:relative}
.photo-pick .change{position:absolute;right:10px;bottom:10px;min-height:36px;padding:0 14px;border-radius:999px;background:rgba(0,0,0,.6);color:#fff;font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.photo-pick input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.photo-pick .change:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.place{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface)}
.place .pm{height:150px}
.place .pi{padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.cacique{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--accent-bg);color:var(--accent)}
.cacique svg{width:12px;height:12px}
.danger{color:#B3261E}
.ichips{display:flex;flex-wrap:wrap;gap:6px}
.ichip{font-size:13px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
/* onboarding */
#onb{position:fixed;inset:0;z-index:3100;background:var(--bg);overflow-y:auto;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.onb-in{max-width:420px;margin:0 auto;min-height:100%;padding:18px 24px 28px;display:flex;flex-direction:column;gap:18px}
.onb-top{display:flex;align-items:center;gap:12px}
.prog{flex:1;height:4px;border-radius:4px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--cardon);transition:width .25s}
.onb-q{font-size:28px;font-weight:700;line-height:1.15;letter-spacing:-.01em;margin:8px 0 0}
.onb-sub{margin:-8px 0 0;color:var(--fg3)}
.deck{position:relative;height:340px;margin:6px 0}
.card{position:absolute;inset:0;border-radius:24px;background:var(--surface);border:1px solid var(--line);box-shadow:0 8px 24px rgba(0,0,0,.08);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;touch-action:pan-y;user-select:none;transition:transform .2s ease}
.card.back{transform:scale(.95) translateY(12px);opacity:.6}
.card .big{width:96px;height:96px;border-radius:30px;background:var(--accent-bg);color:var(--accent);display:flex;align-items:center;justify-content:center}
.card h2{margin:0;font-size:30px;font-weight:700}
.card p{margin:0;color:var(--fg2);max-width:26ch}
.card .stamp{position:absolute;top:22px;font-weight:800;font-size:18px;padding:4px 10px;border-radius:8px;border:3px solid;opacity:0}
.card .stamp.yes{left:22px;color:var(--cardon);border-color:var(--cardon);transform:rotate(-12deg)}
.card .stamp.no{right:22px;color:var(--fg3);border-color:var(--fg3);transform:rotate(12deg)}
.swipe-btns{display:flex;justify-content:center;gap:28px}
.round{width:68px;height:68px;border-radius:999px;border:1px solid var(--line2);background:var(--surface);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.round.yes{color:var(--cardon)}
.opts{display:flex;flex-wrap:wrap;gap:10px}
.opt{min-height:48px;padding:0 18px;border-radius:999px;border:1px solid var(--line2);background:var(--surface);font-weight:600;font-size:15px}
.opt[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.opts.col{flex-direction:column}
.opt:has(input:checked){background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.opt:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.opts.col .opt{border-radius:14px;text-align:left;padding:14px 16px}
#login{position:fixed;inset:0;z-index:3000;background:var(--bg);overflow-y:auto;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.login-in{max-width:400px;margin:0 auto;min-height:100%;padding:56px 24px 32px;display:flex;flex-direction:column;gap:14px}
.login-in .logo{align-self:center;margin-bottom:6px}
.login-claim{text-align:center;font-size:18px;color:var(--fg2);margin:0 0 18px}
.or{display:flex;align-items:center;gap:12px;color:var(--fg3);font-size:13px;margin:6px 0}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line2)}

.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:2000;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:520px;max-height:92%;max-height:92dvh;overflow-y:auto;overscroll-behavior:contain;background:var(--bg);border-radius:20px 20px 0 0;padding:8px 20px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:18px}
.grab{width:36px;height:4px;border-radius:4px;background:var(--line2);margin:0 auto 4px}
.sheet-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.sheet-head h1{margin:0;font-size:24px;font-weight:700;line-height:1.15}
.x{width:40px;height:40px;border-radius:999px;display:flex;align-items:center;justify-content:center;color:var(--fg3);flex-shrink:0}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.lbl{font-size:14px;font-weight:600;color:var(--fg2)}
.input{font-size:16px;min-height:48px;border-radius:10px;border:1px solid var(--line2);background:var(--surface);padding:10px 12px;width:100%}
textarea.input{min-height:76px;resize:vertical}
.input:focus{outline:none;border-color:var(--fg)}
input[type=date],input[type=time]{-webkit-appearance:none;appearance:none;min-width:0}
.choice{display:flex;gap:8px}
.choice label{flex:1;min-height:48px;border:1px solid var(--line2);border-radius:10px;display:flex;align-items:center;justify-content:center;gap:6px;font-weight:600;cursor:pointer;text-align:center;padding:6px;position:relative}
.choice input{position:absolute;opacity:0;pointer-events:none}
.choice label:has(input:checked){background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.sl{display:flex;flex-direction:column;gap:2px}
.sl .top{display:flex;justify-content:space-between;align-items:baseline}
.sl output{font-weight:700;font-size:15px}
.sl input[type=range]{width:100%;accent-color:var(--cardon);height:32px;margin:0}
.sl .ends{display:flex;justify-content:space-between;font-size:12px;color:var(--fg3)}
.score-big{font-size:44px;font-weight:700;line-height:1;letter-spacing:-.02em}
.seats{display:flex;gap:6px;flex-wrap:wrap}
.seat{width:34px;height:34px;border-radius:999px;background:var(--line);display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--fg2)}
.seat.free{background:transparent;border:1px dashed var(--line2)}
.minimap{height:190px;border-radius:12px;overflow:hidden;border:1px solid var(--line2)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--on-ink);padding:12px 16px;border-radius:12px;font-size:14px;font-weight:500;z-index:4000;max-width:min(90vw,440px)}
.code{font-family:ui-monospace,Menlo,monospace;font-size:15px;background:var(--surface);border:1px solid var(--line2);padding:12px;border-radius:10px;user-select:all;letter-spacing:.06em;text-align:center}
.hint{font-size:13px;color:var(--fg3);margin:0}
.cats{display:flex;gap:14px;overflow-x:auto;scrollbar-width:none;padding:4px 0 14px;margin:0 -20px;padding-left:20px;padding-right:20px}
.cats::-webkit-scrollbar{display:none}
.cat{flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:6px;width:64px;font-size:13px;font-weight:600;color:var(--fg2)}
.cat .ic{width:56px;height:56px;border-radius:18px;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--fg)}
.cat[aria-pressed="true"] .ic{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.cat[aria-pressed="true"]{color:var(--fg)}
.price{font-size:20px;font-weight:700}
@media (max-width:380px){
  header.top{padding:10px 16px 2px}
  .tribe-pick,.page-t{font-size:18px}
  main{padding:2px 16px 92px}
  .banner{margin:0 16px 8px}
  .item{gap:10px;padding:12px 0}
  .item-t{font-size:16px}
  .vote{width:48px;height:48px}
  .time,.date{width:44px}
  .mini{padding:0 11px}
  .sheet{padding:8px 16px calc(20px + env(safe-area-inset-bottom,0px))}
  .fab{right:12px;height:46px;padding:0 14px}
  .logo.xl{font-size:56px}
}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(16px);opacity:.7}to{transform:none;opacity:1}}}
</style>
</head>
<body>
<div class="app">
  <header class="top" id="top"></header>
  <div id="banner"></div>
  <div class="stage">
    <main id="view"></main>
    <div id="mapHost" hidden>
      <div id="map" role="region" aria-label="Mapa de lugares"></div>

    <button type="button" data-tab="lugares"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>Lugares</button>
    <button type="button" data-tab="degus"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.4l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9L12 3Z"/></svg>Experiencias</button>

<div id="toastRoot" aria-live="polite"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(function(){
'use strict';
var COLS = ['tribes','antojos','salidas','memberships','votes','asist','reviews','degus','inscripciones'];
var S = { tab:'salidas', uid:'local', meName:'', ready:false, profiles:{}, perfilTab:'visitas', active:null, cat:'', dtipo:'', lugMode:'mapa' };
COLS.forEach(function(c){ S[c] = {}; });
var db = null;
var HAS_MAP = !!window.L;
var BA = [-34.592, -58.437];

/* ---------- helpers ---------- */
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function slug(s){ return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,80) || 'x'; }
function dayStr(o){ var d = new Date(); d.setDate(d.getDate() + (o||0)); return d.toLocaleDateString('sv-SE'); }
function todayStr(){ return dayStr(0); }
function monthKey(){ return todayStr().slice(0,7); }
function dec(n){ return (Math.round(n*10)/10).toFixed(1).replace('.',','); }
function fmtN(n){ return String(n).replace(/\B(?=(\d{3})+(?!\d))/g,'.'); }
function money(n){ return '$' + fmtN(n); }
function initials(s){ var p = String(s||'').trim().split(/\s+/).filter(Boolean); return ((p[0]||'?')[0] + (p[1] ? p[1][0] : (p[0]||'')[1]||'')).toUpperCase(); }
function dObj(iso){ return new Date(iso + 'T12:00:00'); }
function cap(s){ return s.charAt(0).toUpperCase()+s.slice(1); }
function fmtDate(iso){ return cap(dObj(iso).toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long'})); }
function dayLabel(iso){ if(iso === dayStr(0)) return 'Hoy'; if(iso === dayStr(1)) return 'Mañana'; return fmtDate(iso); }
function fmtShort(o){ return cap(dObj(o.fecha).toLocaleDateString('es-AR',{weekday:'short',day:'numeric'}).replace('.','')) + ', ' + o.hora; }
function monShort(iso){ return dObj(iso).toLocaleDateString('es-AR',{month:'short'}).replace('.',''); }
function shortDate(iso){ try{ return new Date(iso).toLocaleDateString('es-AR',{day:'numeric',month:'short'}).replace('.',''); }catch(e){ return ''; } }
function store(k,v){ try{ if(v==null) localStorage.removeItem(k); else localStorage.setItem(k,v); }catch(e){} }
function load(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function code6(){ var c = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789', s = ''; for(var i=0;i<6;i++) s += c[Math.floor(Math.random()*c.length)]; return s; }
function logoSVG(ribs){ return '<svg viewBox="0 0 120 120" aria-hidden="true"><path d="M60 46 H26 Q14 46 14 34 V20" fill="none" stroke="currentColor" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/><path d="M60 46 H94 Q106 46 106 34 V20" fill="none" stroke="currentColor" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/><path d="M46 120 V14 A14 14 0 0 1 74 14 V120 Z" fill="currentColor"/>'+(ribs?'<path d="M56 62 V112 M64 62 V112 M14 22 V36 M106 22 V36" fill="none" style="stroke:var(--bg)" stroke-width="2" stroke-linecap="round" opacity="0.45"/>':'')+'</svg>'; }
function logo(cls){ return '<span class="logo '+(cls||'')+'" role="img" aria-label="tribu">'+logoSVG(cls==='xl')+'<span aria-hidden="true">ribu</span></span>'; }
var ICON = {
  up:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 15 6-6 6 6"/></svg>',
  plus:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>',
  check:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>',
  chev:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>',
  x:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>',
  map:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>'
};

/* ---------- people ---------- */
function nm(id){ if(id === S.uid) return S.meName || 'Vos'; var p = S.profiles[id]; return p ? p.name : 'Alguien'; }
function firstName(id){ return id === S.uid ? 'vos' : nm(id).split(' ')[0]; }
function av(id, cls){ var n = nm(id); return '<span class="av '+(cls||'')+'" role="img" aria-label="'+esc(n)+'">'+esc(initials(n))+'</span>'; }

/* ---------- tribus (grupos privados) ---------- */
function tribe(tid){ return S.tribes[tid]; }
function isMember(u,tid){ var m = S.memberships[u]; return !!(tribe(tid) && m && m.tribes && m.tribes[tid]); }
function membersOf(tid){ return Object.keys(S.memberships).filter(function(u){ return isMember(u,tid); }); }
function myTribes(){ return Object.keys(S.tribes).filter(function(t){ return isMember(S.uid,t); }).sort(function(a,b){ return S.tribes[a].nombre.localeCompare(S.tribes[b].nombre); }); }
function isCacique(u, tid){ var t = tribe(tid); return !!t && t.creador === u; }
function caciqueTag(){ return '<span class="cacique">'+logoSVG(false).replace('<svg ','<svg width="12" height="12" ')+'Cacique</span>'; }
function activeTribe(){ var mine = myTribes(); if(S.active && mine.indexOf(S.active) >= 0) return S.active; return mine[0] || null; }

/* ---------- lugares ---------- */
function votersOf(aid){ return Object.keys(S.votes).filter(function(u){ var v=S.votes[u]; return v && v.antojos && v.antojos[aid]; }); }
function antojosOf(tid){ return Object.keys(S.antojos).filter(function(a){ return S.antojos[a].tribe === tid; }); }
function catsOf(tid){ var c = {}; antojosOf(tid).forEach(function(a){ var k = S.antojos[a].categoria; if(k) c[k] = 1; }); return Object.keys(c).sort(); }
function filteredAntojos(tid){
  return antojosOf(tid).filter(function(a){ return !S.cat || S.antojos[a].categoria === S.cat; }).map(function(id){
    var v = votersOf(id); return {id:id, a:S.antojos[id], voters:v, n:v.length};
  }).sort(function(x,y){ return y.n - x.n || String(y.a.createdAt).localeCompare(String(x.a.createdAt)); });
}
function allReviews(){
  var out = [];
  Object.keys(S.reviews).forEach(function(u){ var it = (S.reviews[u]||{}).items||{}; Object.keys(it).forEach(function(k){ if(it[k]) out.push(Object.assign({}, it[k], {user:u, key:k})); }); });
  return out;
}
function reviewsOfLocal(lk){ return allReviews().filter(function(r){ return r.localKey === lk; }); }
function pointsOf(u, month){ var it = (S.reviews[u]||{}).items||{}; return Object.keys(it).filter(function(k){ return !month || (it[k] && it[k].month === month); }).length * 50; }
function levelOf(p){ return p >= 1000 ? 'Maestro foodie' : p >= 600 ? 'Foodie experto' : p >= 300 ? 'Crítico de barrio' : p >= 100 ? 'Explorador' : 'Comensal nuevo'; }
function ruidoTag(v){ return v <= 3 ? 'Silencioso' : v <= 6 ? 'Moderado' : 'Bullicioso'; }
function porcionTag(v){ return v <= 3 ? 'Gourmet' : v <= 6 ? 'Estándar' : 'Abundante'; }
function scoreOf(r){ return (Number(r.sabor)+Number(r.precio)+Number(r.atencion))/3; }
function myReviews(){ return allReviews().filter(function(r){ return r.user === S.uid; }).sort(function(a,b){ return String(b.createdAt).localeCompare(String(a.createdAt)); }); }

/* ---------- salidas (mínimo, máximo y varias fechas) ---------- */
function optsOf(s){ return s.opciones && s.opciones.length ? s.opciones : [{id:'o1', fecha:s.fecha, hora:s.hora}]; }
function marks(u, sid){ var a = S.asist[u]; return (a && a.salidas && a.salidas[sid]) || null; }
function peopleFor(sid, oid){
  return Object.keys(S.asist).filter(function(u){ var m = marks(u,sid); return m && m.o && m.o[oid]; })
    .sort(function(a,b){ return String(marks(a,sid).at).localeCompare(String(marks(b,sid).at)); });
}
function info(sid){
  var s = S.salidas[sid], t = todayStr();
  var opts = optsOf(s).map(function(o){ var pp = peopleFor(sid, o.id); return {id:o.id, fecha:o.fecha, hora:o.hora, people:pp, n:pp.length, future:o.fecha >= t}; })
    .sort(function(a,b){ return (a.fecha+a.hora).localeCompare(b.fecha+b.hora); });
  var conf = null; opts.forEach(function(o){ if(o.id === s.confirmada) conf = o; });
  var future = opts.filter(function(o){ return o.future; });
  var st;
  if(s.estado === 'cancelada') st = 'cancelada';
  else if(conf && !conf.future) st = 'realizada';
  else if(conf) st = conf.n >= s.max ? 'llena' : 'confirmada';
  else if(!future.length) st = 'vencida';
  else st = 'abierta';
  var best = future.slice().sort(function(a,b){ return b.n - a.n; })[0];
  return {id:sid, s:s, opts:opts, future:future, conf:conf, st:st, min:s.min, max:s.max,
    upcoming: st === 'confirmada' || st === 'llena' || st === 'abierta',
    first: conf || future[0] || opts[0], faltan: best ? Math.max(0, s.min - best.n) : s.min};
}
function pendingSalidas(){
  var mine = myReviews();
  return Object.keys(S.salidas).filter(function(sid){
    var i = info(sid); if(i.st !== 'realizada' || i.conf.people.indexOf(S.uid) < 0) return false;
    return !mine.some(function(r){ return r.localKey === slug(i.s.local) && String(r.createdAt).slice(0,10) >= i.conf.fecha; });
  });
}

/* ---------- experiencias ---------- */
function inscriptos(did){ return Object.keys(S.inscripciones).filter(function(u){ var x = S.inscripciones[u]; return x && x.degus && x.degus[did]; }); }
function dinfo(did){
  var d = S.degus[did], n = inscriptos(did).length, me = inscriptos(did).indexOf(S.uid) >= 0;
  var st = d.fecha < todayStr() ? 'pasada' : n >= d.cupo ? 'completa' : n >= d.min ? 'confirmada' : 'abierta';
  return {id:did, d:d, n:n, me:me, st:st, faltan:Math.max(0, d.min - n)};
}

/* ---------- perfil de intereses ---------- */
var INTERESES = [
  {k:'Vinos', d:'Catas, bodegas y maridajes.'},
  {k:'Café', d:'Especialidad, tostadores y filtrados.'},
  {k:'Té', d:'Hebras, ceremonias y meriendas.'},
  {k:'Vermut', d:'Aperitivo, sifón y picada.'},
  {k:'Ramen', d:'Caldos, fideos y cocina japonesa.'},
  {k:'Pastelería', d:'Laminados, tortas y panaderías.'},
  {k:'Parrilla', d:'Asado, bodegones y cortes.'},
  {k:'Cerveza', d:'Artesanal, IPAs y cervecerías.'}
];
function profile(){ try{ return JSON.parse(load('tf-profile') || 'null'); }catch(e){ return null; } }
var SLOTS = {fm:'Mañanas de finde', ta:'Tardes', ns:'Noches de semana', nf:'Noches de finde'};
function slotOf(fecha, hora){ var wd = dObj(fecha).getDay(), h = parseInt(hora,10), finde = wd === 0 || wd === 6;
  if(h < 13) return finde ? 'fm' : 'ta'; if(h < 19) return 'ta'; return (wd === 5 || wd === 6) ? 'nf' : 'ns'; }
function suggest(x){
  var p = profile(); if(!p) return null;
  var d = x.d, sc = 0, why = '';
  var alc = d.tipo === 'Vinos' || d.tipo === 'Vermut' || d.tipo === 'Cerveza';
  if(alc && (p.restr||[]).indexOf('Sin alcohol') >= 0) return null;
  if((p.likes||[]).indexOf(d.tipo) >= 0){ sc += 3; why = 'Porque te gusta '+(d.tipo === 'Vinos' ? 'el vino' : d.tipo === 'Pastelería' ? 'la pastelería' : d.tipo === 'Té' ? 'el té' : d.tipo === 'Café' ? 'el café' : d.tipo === 'Vermut' ? 'el vermut' : d.tipo === 'Ramen' ? 'el ramen' : d.tipo.toLowerCase()); }
  if(p.budget && d.precio <= p.budget){ sc += 1; why = why || 'Dentro de tu presupuesto'; }
  if((p.slots||[]).indexOf(slotOf(d.fecha, d.hora)) >= 0){ sc += 1; why = why || 'En tu horario: '+SLOTS[slotOf(d.fecha, d.hora)].toLowerCase(); }
  if((p.barrios||[]).indexOf(d.barrio) >= 0){ sc += 1; why = why || 'Cerca, en '+d.barrio; }
  return sc >= 3 ? {score:sc, why:why} : null;
}
function readSet(){ try{ return JSON.parse(load('tf-read') || '{}'); }catch(e){ return {}; } }
function notifs(){
  var out = [], t = todayStr(), tm = dayStr(1), mine = myTribes();
  Object.keys(S.salidas).forEach(function(sid){
    var i = info(sid); if(mine.indexOf(i.s.tribe) < 0 || !i.upcoming) return;
    var tn = tribe(i.s.tribe).nombre, my = marks(S.uid, sid);
    if(i.conf){
      var isIn = i.conf.people.indexOf(S.uid) >= 0;
      if(isIn && (i.conf.fecha === t || i.conf.fecha === tm)) out.push({id:'rec-'+sid+i.conf.fecha, k:0, act:'openSalida', ref:sid, title:(i.conf.fecha === t ? 'Hoy' : 'Mañana')+': '+i.s.local+' a las '+i.conf.hora, sub:tn});
      else if(isIn) out.push({id:'conf-'+sid, k:2, act:'openSalida', ref:sid, title:'Se confirmó '+i.s.local, sub:fmtShort(i.conf)+' · '+tn});
      else if(i.st !== 'llena') out.push({id:'confx-'+sid, k:2, act:'openSalida', ref:sid, title:'Se confirmó '+i.s.local+'. ¿Te sumás?', sub:fmtShort(i.conf)+' · quedan '+(i.max - i.conf.n)+' lugares'});
    } else if(!my && i.s.organizador !== S.uid){
      out.push({id:'new-'+sid, k:1, act:'openSalida', ref:sid, title:cap(firstName(i.s.organizador))+' propuso '+i.s.local, sub:(i.future.length > 1 ? i.future.length+' fechas posibles' : fmtShort(i.future[0]))+' · '+tn});
    } else if(my && i.faltan === 1){
      out.push({id:'falta-'+sid, k:1, act:'openSalida', ref:sid, title:'A '+i.s.local+' le falta 1 persona', sub:'Invitá a alguien de '+tn});
    }
  });
  pendingSalidas().forEach(function(sid){ out.push({id:'rev-'+sid, k:1, act:'evaluarSalida', ref:sid, title:'¿Cómo estuvo '+S.salidas[sid].local+'?', sub:'Tu reseña suma 50 puntos'}); });
  Object.keys(S.degus).map(dinfo).forEach(function(x){
    if(x.st === 'pasada') return;
    if(x.me && (x.d.fecha === t || x.d.fecha === tm)){ out.push({id:'drec-'+x.id, k:0, act:'openDegu', ref:x.id, title:(x.d.fecha === t ? 'Hoy' : 'Mañana')+': '+x.d.titulo+' a las '+x.d.hora, sub:x.d.lugar}); return; }
    if(x.me) return;
    var friends = inscriptos(x.id).filter(function(u){ return u !== S.uid && mine.some(function(tid){ return isMember(u, tid); }); });
    if(friends.length) out.push({id:'df-'+x.id+'-'+friends.length, k:2, act:'openDegu', ref:x.id, title:cap(firstName(friends[0]))+(friends.length > 1 ? ' y '+(friends.length-1)+' más se anotaron' : ' se anotó')+' a '+x.d.titulo, sub:x.d.tipo+' · '+fmtShort(x.d)});
    else { var sg = suggest(x); if(sg && x.st !== 'completa') out.push({id:'ds-'+x.id, k:3, act:'openDegu', ref:x.id, title:'Para vos: '+x.d.titulo, sub:sg.why}); }
  });
  return out.sort(function(a,b){ return a.k - b.k; });
}

/* ---------- escritura ---------- */
var queues = {};
function serial(key, fn){ var p = (queues[key] || Promise.resolve()).then(fn, fn); queues[key] = p.catch(function(){}); return p; }
function act(p, okMsg){ return Promise.resolve(p).then(function(r){ if(okMsg) toast(okMsg); return r; }, function(e){ toast('No se pudo guardar. Probá de nuevo.'); throw e; }); }
function setMine(col, field, key, val){
  return serial(col, function(){
    var cur = Object.assign({}, S[col][S.uid] || {}), map = Object.assign({}, cur[field] || {});
    if(val === undefined || val === false || val === null) delete map[key]; else map[key] = val;
    cur[field] = map; S[col][S.uid] = cur; schedule();
    return db.collection(col).doc(S.uid).set(cur);
  });
}
function setMark(sid, oid, on){
  return serial('asist', function(){
    var cur = Object.assign({}, S.asist[S.uid] || {}), sal = Object.assign({}, cur.salidas || {});
    var m = sal[sid] ? {o:Object.assign({}, sal[sid].o || {}), at:sal[sid].at} : {o:{}, at:new Date().toISOString()};
    if(on) m.o[oid] = true; else delete m.o[oid];
    if(Object.keys(m.o).length) sal[sid] = m; else delete sal[sid];
    cur.salidas = sal; S.asist[S.uid] = cur; schedule();
    return db.collection('asist').doc(S.uid).set(cur);
  });
}
function markOption(sid, oid, on){
  var s = S.salidas[sid], ref = db.collection('salidas').doc(sid);
  if(!on) return setMark(sid, oid, false).then(function(){
    var i = info(sid);
    if(s.confirmada === oid && i.conf && i.conf.n < s.min) return ref.update({confirmada:''}).then(function(){ toast('Quedó por debajo del mínimo: la salida vuelve a buscar gente.'); });
  });
  var n = peopleFor(sid, oid).length;
  if(n >= s.max){ toast('Esa fecha ya está completa.'); return Promise.resolve(false); }
  return setMark(sid, oid, true).then(function(){
    if(!s.confirmada && n + 1 >= s.min){
      var o = optsOf(s).filter(function(x){ return x.id === oid; })[0];
      return ref.update({confirmada:oid}).then(function(){ toast('¡Se confirmó! '+s.local+', '+fmtShort(o)+'.'); });
    }
  });
}

function removeFromTribe(u, tid){
  var m = Object.assign({}, S.memberships[u] || {}), tr = Object.assign({}, m.tribes || {}); delete tr[tid]; m.tribes = tr;
  var a = Object.assign({}, S.asist[u] || {}), sal = Object.assign({}, a.salidas || {});
  Object.keys(sal).forEach(function(sid){ if(S.salidas[sid] && S.salidas[sid].tribe === tid) delete sal[sid]; }); a.salidas = sal;
  return Promise.all([db.collection('memberships').doc(u).set(m), db.collection('asist').doc(u).set(a)]);
}
function deleteTribe(tid){
  var ops = [];
  Object.keys(S.memberships).forEach(function(u){ if(S.memberships[u] && S.memberships[u].tribes && S.memberships[u].tribes[tid]) ops.push(removeFromTribe(u, tid)); });
  Object.keys(S.antojos).forEach(function(a){ if(S.antojos[a].tribe === tid) ops.push(db.collection('antojos').doc(a).remove()); });
  Object.keys(S.salidas).forEach(function(x){ if(S.salidas[x].tribe === tid) ops.push(db.collection('salidas').doc(x).remove()); });
  return Promise.all(ops).then(function(){ return db.collection('tribes').doc(tid).remove(); }).then(function(){ if(S.active === tid){ S.active = null; store('tf-active', null); } });
}

/* ---------- mapa ---------- */
var map = null, markers = null, mapKey = null;
function tileUrl(){ var dark = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches; return 'https://{s}.basemaps.cartocdn.com/'+(dark?'dark_all':'light_all')+'/{z}/{x}/{y}{r}.png'; }
function syncMap(tid){
  if(!map){ map = L.map('map', {zoomControl:false}).setView(BA, 14);
    L.tileLayer(tileUrl(), {maxZoom:19, subdomains:'abcd', attribution:'&copy; OpenStreetMap &copy; CARTO'}).addTo(map);
    markers = L.layerGroup().addTo(map); }
  map.invalidateSize(); markers.clearLayers();
  var pts = [];
  filteredAntojos(tid).forEach(function(o){
    var a = o.a; if(typeof a.lat !== 'number') return;
    var on = o.voters.indexOf(S.uid) >= 0;
    var m = L.marker([a.lat, a.lng], {icon:L.divIcon({className:'', html:'<div class="pin'+(on?' on':'')+'">'+o.n+'</div>', iconSize:[34,34], iconAnchor:[17,17]}), title:a.nombre+', '+o.n+' votos', keyboard:true});
    m.on('click', function(){ sheetAntojo(o.id); }); m.addTo(markers); pts.push([a.lat, a.lng]);

function bindSwipe(card){

  card.addEventListener('pointermove', function(e){ if(x0 === null) return; dx = e.clientX - x0; card.style.transform = 'translateX('+dx+'px) rotate('+(dx/18)+'deg)';
    card.querySelector('.stamp.yes').style.opacity = Math.max(0, Math.min(1, dx/90)); card.querySelector('.stamp.no').style.opacity = Math.max(0, Math.min(1, -dx/90)); });
  var end = function(){ if(x0 === null) return; x0 = null; card.style.transition = '';
    if(Math.abs(dx) > 90) swipe(dx > 0); else { card.style.transform = ''; card.querySelectorAll('.stamp').forEach(function(s){ s.style.opacity = 0; }); } };

function localDb(seed){

  try{ data = JSON.parse(load(KEY) || 'null'); }catch(e){ data = null; }

  var subs = {};
  function save(){ store(KEY, JSON.stringify(data)); }
  function snap(col){ return {docs:Object.keys(data[col]).map(function(id){ return {id:id, data:function(){ return JSON.parse(JSON.stringify(data[col][id])); }}; })}; }
  function emit(col){ (subs[col]||[]).forEach(function(fn){ fn(snap(col)); }); }
  function merge(a,b){ var o = Object.assign({}, a); Object.keys(b).forEach(function(k){ o[k] = (b[k] && typeof b[k]==='object' && !Array.isArray(b[k]) && o[k] && typeof o[k]==='object') ? merge(o[k], b[k]) : b[k]; }); return o; }
  window.addEventListener('storage', function(e){ if(e.key !== KEY) return; try{ data = JSON.parse(e.newValue) || data; }catch(x){} COLS.forEach(emit); });
  return {collection:function(col){ return {
    onSnapshot:function(fn){ (subs[col] = subs[col] || []).push(fn); setTimeout(function(){ fn(snap(col)); }, 0); },
    add:function(o){ var id = 'l' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); data[col][id] = o; save(); emit(col); return Promise.resolve({id:id}); },

      update:function(o){ data[col][id] = merge(data[col][id] || {}, o); save(); emit(col); return Promise.resolve(); },
      remove:function(){ delete data[col][id]; save(); emit(col); return Promise.resolve(); }
    }; }
  }; }};
}
